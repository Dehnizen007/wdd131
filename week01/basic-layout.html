<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeholder Layout</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: left;
    }
    nav {
      background-color: #000;
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      display: flex;
      min-height: 400px;
    }
    .content {
      flex: 3;
      background-color: #ccc;
      padding: 20px;
    }
    aside {
      flex: 1;
      background-color: #fff;
      padding: 20px;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Header Content</h1>
  </header>
  <nav>
    <a href="#">Home</a>
    <a href="#">Projects</a>
    <a href="#">Services</a>
    <a href="#">Contact Us</a>
  </nav>
  <main>
    <div class="content">
      <h2>Main Content</h2>
      <p>Placeholder text and images go here.</p>
    </div>
    <aside>
      <h2>Aside Content</h2>
      <p>Additional placeholder text or images.</p>
    </aside>
  </main>
  <footer>
    <p>Footer Content</p>
  </footer>
</body>
</html>
