<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Share your experience with a product in this accessible product review form.">
  <meta name="author" content="Dennison Ehidiamhen Iyere">
  <title>Product Review | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
  <script src="scripts/getdates.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="form.html">Product Review</a>
    <p>WDD 131 · Week 05</p>
  </header>

  <main>
    <section class="form-intro" aria-labelledby="page-title">
      <p class="eyebrow">Your experience matters</p>
      <h1 id="page-title">Review a product</h1>
      <p>Tell us what worked well for you.</p>
    </section>

    <form action="review.html" method="get">
      <div class="form-field">
        <label for="product">Product Name <span class="required-note">Required</span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-field rating-field">
        <legend>Overall Rating <span class="required-note">Required</span></legend>
        <div class="rating-options">
          <label for="rating-1"><input id="rating-1" name="rating" type="radio" value="1" required><span aria-hidden="true">&#9733;</span><span class="rating-label">1 star</span></label>
          <label for="rating-2"><input id="rating-2" name="rating" type="radio" value="2" required><span aria-hidden="true">&#9733;&#9733;</span><span class="rating-label">2 stars</span></label>
          <label for="rating-3"><input id="rating-3" name="rating" type="radio" value="3" required><span aria-hidden="true">&#9733;&#9733;&#9733;</span><span class="rating-label">3 stars</span></label>
          <label for="rating-4"><input id="rating-4" name="rating" type="radio" value="4" required><span aria-hidden="true">&#9733;&#9733;&#9733;&#9733;</span><span class="rating-label">4 stars</span></label>
          <label for="rating-5"><input id="rating-5" name="rating" type="radio" value="5" required><span aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span><span class="rating-label">5 stars</span></label>
        </div>
      </fieldset>

      <div class="form-field">
        <label for="installation-date">Date of Installation <span class="required-note">Required</span></label>
        <input id="installation-date" name="installation-date" type="date" required>
      </div>

      <fieldset class="form-field features-field">
        <legend>Useful Features <span class="optional-note">Select all that apply</span></legend>
        <label class="check-option" for="feature-durability"><input id="feature-durability" name="features" type="checkbox" value="durability">Durability</label>
        <label class="check-option" for="feature-ease"><input id="feature-ease" name="features" type="checkbox" value="ease-of-use">Ease of use</label>
        <label class="check-option" for="feature-performance"><input id="feature-performance" name="features" type="checkbox" value="performance">Performance</label>
        <label class="check-option" for="feature-design"><input id="feature-design" name="features" type="checkbox" value="design">Design</label>
      </fieldset>

      <div class="form-field">
        <label for="written-review">Written Review <span class="optional-note">Optional</span></label>
        <textarea id="written-review" name="written-review" rows="5"></textarea>
      </div>

      <div class="form-field">
        <label for="user-name">Your Name <span class="optional-note">Optional</span></label>
        <input id="user-name" name="user-name" type="text" autocomplete="name">
      </div>

      <input class="submit-button" type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> &#127800; Dennison Ehidiamhen Iyere &#127800; Nigeria</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
